apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelybites
  labels:
    app: homelybites
    app.kubernetes.io/name: homelybites
    app.kubernetes.io/part-of: homelybites-food-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homelybites
  template:
    metadata:
      labels:
        app: homelybites
    spec:
      containers:
        - name: homelybites
          image: image-registry.openshift-image-registry.svc:5000/homelybites:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: homelybites-config
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
